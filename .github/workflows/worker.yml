name: Mail and reminders

on:
  schedule:
    - cron: '*/15 * * * *'   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      force_reminders:
        description: 'Send reminders now, even before 09:00'
        type: boolean
        default: false

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - run: python worker/run.py ${{ inputs.force_reminders && '--force' || '' }}
        env:
          SUPABASE_URL: https://zqbimrpywehyfodghgan.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: ${{ vars.GROQ_TEXT_MODEL || 'openai/gpt-oss-120b' }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:yardenkal207@gmail.com

  # GitHub turns off scheduled workflows after 60 days without repo activity.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    steps:
      - run: gh workflow enable worker.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
